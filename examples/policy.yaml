# Example v1 policy. Safe by default: the allowed_tools allowlist is the
# load-bearing control and is checked first, so any tool it does not name is
# denied. Prefer the v2 policy in examples/scoped-refund/policy.yaml for new
# integrations; the v2 default is structurally deny.
default_action: allow
redact_secret_outputs: true

allowed_tools:
  - read_file
  - read_directory
  - list_directory
  - search
  - grep
  - glob
  - write_file
  - edit_file

denied_tools:
  - delete_file
  - run_shell

blocked_path_patterns:
  - ".env"
  - "**/.env"
  - ".ssh/**"
  - "**/id_rsa"
  - ".aws/**"
  - ".npmrc"

blocked_env_names:
  - GITHUB_TOKEN
  - OPENAI_API_KEY
  - AWS_SECRET_ACCESS_KEY

blocked_network_hosts:
  - 169.254.169.254
  - metadata.google.internal

denied_capabilities:
  - credential_access

require_approval_capabilities:
  - shell_execution
  - production_mutation
