name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/runtime-validated.txt -e '.[http]'
          python -m pip install -r requirements/validation.txt
      - name: Architecture boundary
        run: python scripts/check_architecture.py
      - name: Repository secret scan
        run: python scripts/check_secrets.py
      - name: Static security scan
        run: python scripts/security_scan.py
      - name: Dependency audit
        run: python -m pip_audit --progress-spinner off --timeout 60
