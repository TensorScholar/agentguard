name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/runtime-validated.txt -e '.[http]'
          python -m pip install -r requirements/validation.txt
      - name: Architecture boundary
        run: python scripts/check_architecture.py
      - name: Repository secret scan
        run: python scripts/check_secrets.py
      - name: Static security scan
        run: python scripts/security_scan.py
      - name: Dependency audit
        # PYSEC-2026-3552 affects cryptography PKCS#7 decryption APIs.
        # AgentGuard currently uses only Ed25519 APIs. Remove this exception
        # when cryptography 50.0.0+ is available and validated, or before
        # introducing any PKCS#7 decryption path.
        run: |
          python -m pip_audit \
            --progress-spinner off \
            --timeout 60 \
            --ignore-vuln PYSEC-2026-3552
