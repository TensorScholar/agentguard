name: Self-hosted validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: self-hosted-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Self-hosted validation
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - agentguard-core
    timeout-minutes: 20
    if: >-
      github.actor == 'TensorScholar' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Create isolated virtual environment
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/agentguard-q05-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          echo "AGENTGUARD_Q05_VENV=$VENV" >> "$GITHUB_ENV"

      - name: Safe environment provenance
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Safe Environment Provenance ==="
          uname -a
          uname -m
          sw_vers
          python --version
          python -m pip --version
          git --version
          echo "GITHUB_SHA: ${GITHUB_SHA}"
          echo "HEAD_SHA: $(git rev-parse HEAD)"
          echo "RUNNER_NAME: ${{ runner.name }}"
          echo "RUNNER_OS: ${{ runner.os }}"
          echo "RUNNER_ARCH: ${{ runner.arch }}"
          echo "EVENT_NAME: ${{ github.event_name }}"

      - name: Install dependencies and check
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -c requirements/confirmatory-runtime-lock.txt -e '.[http]'
          python -m pip install -c requirements/confirmatory-runtime-lock.txt -r requirements/validation.txt
          python -m pip check

      # Scoped to the research branch ONLY. Do not widen this.
      #
      # CONFIRMATORY_RUNTIME_IDENTITY.json freezes the git blob of pyproject.toml
      # (and four other paths) as the identity of the confirmatory experiment. The
      # preflight fails closed when any of them drift, which is correct for
      # research integrity but means it can never pass on a product commit:
      # every product change to packaging or version drifts pyproject.toml by
      # design. On such commits it failed before `make check` could run, so this
      # workflow produced no engineering signal at all.
      #
      # `github.head_ref` is set for pull_request events (where github.ref is
      # refs/pull/N/merge); the github.ref arm covers a direct push. Both are
      # needed because this workflow triggers on push-to-main and PR-to-main.
      - name: Confirmatory runtime preflight
        if: >-
          github.head_ref == 'research/authorization-lineage-experiment-v1' ||
          github.ref == 'refs/heads/research/authorization-lineage-experiment-v1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python -m agentguard.research.authorization_lineage.preflight \
            --expected-git-commit "$GITHUB_SHA" \
            --output evidence/confirmatory-preflight.json

      - name: Engineering gate
        shell: bash
        run: |
          set -euo pipefail
          make check

      - name: Dependency security audit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip_audit \
            --progress-spinner off \
            --timeout 60

      - name: MCP security gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
            python -m agentguard.cli gate \
              --changed-from "$BASE_REF" \
              --fail-on-risk high \
              --format findings-json \
              --output evidence/agentguard-findings.json \
              --summary-output evidence/agentguard-summary.md
          else
            python -m agentguard.cli scan \
              --format findings-json \
              --output evidence/agentguard-findings.json \
              --summary-output evidence/agentguard-summary.md
          fi

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f evidence/agentguard-summary.md ]; then
            cat evidence/agentguard-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate safe evidence summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          # Report the preflight honestly instead of asserting PASS unconditionally.
          # It only runs on the research branch; on product refs it did not execute.
          if [ "${{ github.head_ref }}" = "research/authorization-lineage-experiment-v1" ] ||
             [ "${{ github.ref }}" = "refs/heads/research/authorization-lineage-experiment-v1" ]; then
            CONFIRMATORY_PREFLIGHT_STATUS="PASS"
          else
            CONFIRMATORY_PREFLIGHT_STATUS="NOT_RUN (research-branch-only gate)"
          fi
          cat <<EOF > evidence/self-hosted-evidence.md
          # Self-Hosted CI Execution Evidence

          - **Event Type**: ${{ github.event_name }}
          - **Commit SHA**: ${{ github.sha }}
          - **Git HEAD**: $(git rev-parse HEAD)
          - **Runner Name**: ${{ runner.name }}
          - **Runner OS**: ${{ runner.os }}
          - **Runner Architecture**: ${{ runner.arch }}
          - **Python Version**: $(python --version 2>&1)
          - **Pip Check**: PASS
          - **Confirmatory Runtime Preflight**: ${CONFIRMATORY_PREFLIGHT_STATUS}
          - **Make Check**: PASS
          - **Dependency Audit**: PASS
          - **AgentGuard Gate**: PASS

          \`\`\`text
          CI_EXECUTION_CLASS=self-hosted
          HOSTED_CI_REPLACED=true
          HOSTED_CI_REPLACED_MEANING=primary validation path since PR #30; hosted ci.yml/codeql.yml/security.yml are workflow_dispatch-only
          HOSTED_CI_GREEN_ON_THIS_REF=false
          CROSS_PLATFORM_MATRIX=false
          TRUST_SCOPE=trusted-owner-same-repository-only
          RUNNER_PERSISTENCE=persistent
          SELF_HOSTED_RUNNER_GENERAL_PR_SAFE=false
          \`\`\`
          EOF

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f evidence/self-hosted-evidence.md ]; then
            cat evidence/self-hosted-evidence.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Evidence completeness gate
        shell: bash
        run: |
          set -euo pipefail
          test -s evidence/self-hosted-evidence.md
          test -s evidence/agentguard-findings.json
          test -s evidence/agentguard-summary.md
          # The confirmatory preflight only runs on the research branch (see its
          # `if:` above), so its output is only required there. Asserting it
          # unconditionally would fail every product run.
          if [ "${{ github.head_ref }}" = "research/authorization-lineage-experiment-v1" ] ||
             [ "${{ github.ref }}" = "refs/heads/research/authorization-lineage-experiment-v1" ]; then
            test -s evidence/confirmatory-preflight.json
          else
            if [ -e evidence/confirmatory-preflight.json ]; then
              echo "::warning::unexpected confirmatory preflight output on a non-research ref"
            fi
          fi

      - name: Upload safe evidence artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: self-hosted-validation-evidence
          path: |
            evidence/self-hosted-evidence.md
            evidence/confirmatory-preflight.json
            evidence/agentguard-findings.json
            evidence/agentguard-summary.md
          if-no-files-found: error

      - name: Cleanup isolated virtual environment
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${AGENTGUARD_Q05_VENV:-}" ] && [ -n "${RUNNER_TEMP:-}" ]; then
            case "$AGENTGUARD_Q05_VENV" in
              "$RUNNER_TEMP"/agentguard-q05-*)
                if [ -d "$AGENTGUARD_Q05_VENV" ]; then
                  echo "Safely removing isolated venv: $AGENTGUARD_Q05_VENV"
                  rm -rf "$AGENTGUARD_Q05_VENV"
                else
                  echo "Venv directory does not exist: $AGENTGUARD_Q05_VENV"
                fi
                ;;
              *)
                echo "Refusing to delete unverified path: $AGENTGUARD_Q05_VENV" >&2
                exit 1
                ;;
            esac
          fi
