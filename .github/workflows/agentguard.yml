name: AgentGuard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-security-gate:
    name: MCP security gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install AgentGuard
        run: python -m pip install -c requirements/runtime-validated.txt -e .

      - name: Run changed-config gate
        shell: bash
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          else
            BASE_REF="${{ github.event.before }}"
          fi

          if [[ "$BASE_REF" =~ ^0+$ ]]; then
            python -m agentguard.cli scan \
              --format findings-json \
              --output agentguard-findings.json \
              --summary-output agentguard-summary.md
            STATUS=$?
          else
            python -m agentguard.cli gate \
              --changed-from "$BASE_REF" \
              --fail-on-risk high \
              --format findings-json \
              --output agentguard-findings.json \
              --summary-output agentguard-summary.md
            STATUS=$?
          fi

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f agentguard-summary.md ]; then
            cat agentguard-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$STATUS"

      - name: Upload AgentGuard report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentguard-scan
          path: |
            agentguard-findings.json
            agentguard-summary.md
          if-no-files-found: error
