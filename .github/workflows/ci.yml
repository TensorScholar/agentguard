name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,http]'
      - run: make check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv /tmp/agentguard-wheel-smoke
      - run: /tmp/agentguard-wheel-smoke/bin/python -m pip install dist/*.whl
      - run: /tmp/agentguard-wheel-smoke/bin/agentguard --version
      - run: /tmp/agentguard-wheel-smoke/bin/agentguard --help
      - run: /tmp/agentguard-wheel-smoke/bin/agentguard demo --output /tmp/agentguard-demo
      - run: /tmp/agentguard-wheel-smoke/bin/agentguard evidence-verify /tmp/agentguard-demo/evidence
      - run: /tmp/agentguard-wheel-smoke/bin/python -m pip check
