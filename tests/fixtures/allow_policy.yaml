# Test-only v1 policy. Explicitly allow-default with an empty allowlist so the
# product default stays deny. Used by subprocess tests that exercise stdio
# transport, inventory, correlation and drain behaviour rather than the default
# effect, and which need a real policy file on disk for the CLI.
default_action: allow
redact_secret_outputs: true

blocked_path_patterns:
  - ".env"
  - "**/.env"
  - ".ssh/**"
  - "**/id_rsa"
  - ".aws/**"
  - ".npmrc"

blocked_network_hosts:
  - 169.254.169.254
  - metadata.google.internal
