[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.2.0rc3"
description = "Provider-neutral action integrity for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mohammad Atashi"}]
keywords = ["ai-agents", "mcp", "authorization", "security", "credential-broker", "audit"]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
  "rich>=13,<15",
  "cryptography>=50.0.1,<51"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13"
]

[project.urls]
Repository = "https://github.com/TensorScholar/agentguard"
Issues = "https://github.com/TensorScholar/agentguard/issues"
Changelog = "https://github.com/TensorScholar/agentguard/blob/main/CHANGELOG.md"
Security = "https://github.com/TensorScholar/agentguard/blob/main/.github/SECURITY.md"

[project.optional-dependencies]
http = ["starlette>=1.3.1,<2", "httpx>=0.27,<1", "uvicorn>=0.30,<1"]
otel = ["opentelemetry-api>=1.27,<2", "opentelemetry-sdk>=1.27,<2"]
dev = [
  "pytest>=8,<10",
  "coverage>=7,<8",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "jsonschema>=4.23,<5",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
agentguard = "agentguard.cli:entrypoint"
agentguard-mcp-http = "agentguard.http_cli:entrypoint"
agentguard-reconcile = "agentguard.reconcile_cli:entrypoint"
agentguard-reconcile-worker = "agentguard.reconcile_worker_cli:entrypoint"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
[tool.setuptools.packages.find]
where = ["src"]
# The pre-registered authorization-lineage research program is retained in the
# repository as the project's research record, but it is not part of the
# distributed runtime. Its result is RESEARCH_CLAIM: NOT_VALIDATED /
# AGENTGUARD_SPECIFIC_DIFFERENTIATION_THESIS: FALSIFIED_WITHIN_PROTOCOL (see
# docs/research/FREEZE_V2_RESULT_ADJUDICATION.md), so it is excluded from the
# wheel and sdist rather than shipped as unreferenced product code. It remains
# importable from a source checkout or an editable install, which is how
# tests/research exercises it.
exclude = ["agentguard.research*"]
[tool.setuptools.package-data]
agentguard = ["py.typed", "resources/*.yaml", "resources/*.json", "resources/policy_packs/*.yaml"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["agentguard"]
# agentguard.research is excluded from the distribution (see
# tool.setuptools.packages.find.exclude) and is not under the product quality
# gate. Its tests still run; they just do not consume the shipped-package
# coverage budget.
omit = ["*/agentguard/research/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agentguard"]
