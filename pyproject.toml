[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.2.0rc2"
description = "Provider-neutral action integrity for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mohammad Atashi"}]
keywords = ["ai-agents", "mcp", "authorization", "security", "credential-broker", "audit"]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
  "rich>=13,<15",
  "cryptography>=49.0.0,<50"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13"
]

[project.urls]
Repository = "https://github.com/TensorScholar/agentguard"
Issues = "https://github.com/TensorScholar/agentguard/issues"
Changelog = "https://github.com/TensorScholar/agentguard/blob/main/CHANGELOG.md"
Security = "https://github.com/TensorScholar/agentguard/blob/main/.github/SECURITY.md"

[project.optional-dependencies]
http = ["starlette>=1.3.1,<2", "httpx>=0.27,<1", "uvicorn>=0.30,<1"]
otel = ["opentelemetry-api>=1.27,<2", "opentelemetry-sdk>=1.27,<2"]
dev = [
  "pytest>=8,<10",
  "coverage>=7,<8",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "jsonschema>=4.23,<5",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
agentguard = "agentguard.cli:entrypoint"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
agentguard = ["py.typed", "resources/*.yaml", "resources/*.json", "resources/policy_packs/*.yaml"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["agentguard"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agentguard"]
